addEventListener('keydown',e=>{const k=e.key.toLowerCase();const m={arrowleft:'L',a:'L',arrowright:'R',d:'R',arrowup:'U',w:'U',arrowdown:'D',s:'D'}[k];if(m){e.preventDefault();act(m)}else if(st==='intro'&&(k===' '||k==='enter'))startGame()});
/* update */
const clock=new THREE.Clock(),V=new THREE.Vector3(),T0=new THREE.Vector3(0,3.2,-5),T1=new THREE.Vector3(0,2,-15);
function smashObs(o){o.fly={vx:(Math.random()-.5)*14,vy:16,vz:-26,t:0};smash++;shake=.4;sfx.smash()}
function update(dt){tm+=dt;
pr.intensity=Math.max(0,1.6+Math.sin(tm*9)*1.6);pb.intensity=Math.max(0,1.6-Math.sin(tm*9)*1.6);
if(st!=='intro')shT+=dt;
if(box.parent&&st!=='intro'){pieces.forEach(p=>{const u=p.userData;p.position.addScaledVector(u.v,dt);u.v.y-=25*dt;p.rotation.x+=u.r.x*dt;p.rotation.y+=u.r.y*dt;p.rotation.z+=u.r.z*dt;p.scale.setScalar(Math.max(.001,1-Math.max(0,shT-.5)/.9))});if(shT>1.5)scene.remove(box)}
else if(st==='intro')box.rotation.y=Math.sin(tm*.8)*.1;
for(let i=fl.length-1;i>=0;i--){const f=fl[i],m=f.m;m.position.x+=f.vx*dt;m.position.y+=f.vy*dt;m.position.z+=f.vz*dt;f.vy-=30*dt;m.rotation.x+=9*dt;m.rotation.z+=5*dt;f.t+=dt;if(f.t>1.3){scene.remove(m);fl.splice(i,1)}}
let d=0;
if(st==='play'){const ramp=.3+.7*Math.min(1,shT/1.6),base=26*(1+.8*(1-Math.exp(-dist/5000)));speed=Math.min(46.8,base*(power>0?1.12:1))*ramp;d=speed*dt;dist+=d;
roadTex.offset.y+=d/10.14;rows.forEach(r=>{r.position.z+=d;if(r.position.z>20)r.position.z-=144});
sp+=d;if(sp>=GAP){sp-=GAP;spawn()}
if(power>0){power-=dt;energy=Math.max(0,power/5*100);if(power<=0)endPower()}
if(inv>0){inv-=dt;if(inv<=0)setOp(cm(),1)}
if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
P.position.x+=(lane*3-P.position.x)*Math.min(1,dt*12);
if(py>0||vy>0){vy-=45*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
if(slide>0)slide-=dt;P.position.y=py;P.rotation.z=(P.position.x-lane*3)*.06;
// docs
for(let i=dc.length-1;i>=0;i--){const m=dc[i];m.position.z+=d;m.rotation.y+=dt*3;
if(power>0&&m.position.z>-75){const k=Math.min(1,dt*7);m.position.x+=(P.position.x-m.position.x)*k;m.position.y+=(py+1.6-m.position.y)*k;m.position.z+=(0-m.position.z)*k*.6}
if(Math.abs(m.position.x-P.position.x)<1.3&&Math.abs(m.position.z)<1.5&&Math.abs(m.position.y-(py+1.6))<2.1){scene.remove(m);dc.splice(i,1);docs++;combo++;comboT=.7;sfx.coin(combo);if(power<=0){energy=Math.min(100,energy+5);if(energy>=100)startPower()}}
else if(m.position.z>14){scene.remove(m);dc.splice(i,1)}}
// obstacles
for(let i=obs.length-1;i>=0;i--){const o=obs[i],m=o.m;m.position.z+=d;
if(o.fly){const f=o.fly;m.position.x+=f.vx*dt;m.position.y+=f.vy*dt;m.position.z+=f.vz*dt;f.vy-=30*dt;m.rotation.x+=7*dt;m.rotation.z+=6*dt;f.t+=dt;m.scale.setScalar(Math.max(.01,1-Math.max(0,f.t-.6)/.5));if(f.t>1.1){scene.remove(m);obs.splice(i,1)}continue}
const z=m.position.z;
if(!o.done&&z>-1.4&&z<1.4&&Math.abs(P.position.x-o.x)<o.w/2+.4){const hit=o.t=='fence'?py<1.6:o.t=='gantry'?!(slide>0&&py<.2):true;
if(hit){if(power>0){o.done=true;smashObs(o)}else if(inv<=0){o.done=true;hurt()}}}
if(z>14){scene.remove(m);obs.splice(i,1)}}
}
// player visuals
if(st==='play'||st==='over'){const m=cm();if(st==='play'){if(m.position.z>0)m.position.z=Math.max(0,m.position.z-dt*40);pose(m,tm*Math.max(.5,speed/26),slide>0&&py<.1);
if(inv>0&&power<=0)setOp(m,Math.floor(tm*12)%2?.3:.85);
enterT=Math.max(0,enterT-dt);aura.visible=power>0||enterT>0;if(aura.visible){aura.material.color.setHex(power>0?(Math.floor(tm*10)%2?0xff3a20:0xffc830):0xffd24a);aura.scale.setScalar(1+Math.sin(tm*12)*.1)}}}
$('sd').textContent=docs;$('sm').textContent=Math.floor(dist/2);$('eb').style.width=energy+'%';
// camera
const k0=st==='intro'?0:Math.min(1,shT/1.4),k=k0*k0*(3-2*k0);
cx+=(P.position.x*.4-cx)*Math.min(1,dt*5);cy+=(6.5+py*.25-cy)*Math.min(1,dt*5);
shake=Math.max(0,shake-dt*2.2);
V.set(cx,cy,11);camera.position.lerpVectors(new THREE.Vector3(0,5,13),V,k);
camera.position.x+=(Math.random()-.5)*shake*1.4;camera.position.y+=(Math.random()-.5)*shake*1.4;
camera.lookAt(V.lerpVectors(T0,T1,k));}
function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}
reset();loop();
</script></body></html>
